<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafb" />
    <title>数字小祥网页端配对</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card">
        <div class="card-mascot" aria-hidden="true">
          <img src="/neutral.png" alt="" />
        </div>

        <header class="hero">
          <div class="hero-brand">
            <div class="device-pair" aria-hidden="true">
              <div class="device-pair__desktop"></div>
              <div class="device-pair__signal">
                <i></i><i></i><i></i>
              </div>
              <div class="device-pair__phone"></div>
            </div>
            <div class="hero-copy">
              <span class="eyebrow">数字小祥 网页端</span>
              <h1>扫描二维码 连接手机端</h1>
              <p class="hero-desc">手机与电脑需连接至同一 Wi-Fi 或局域网络</p>
            </div>
          </div>
          <div class="status-badge" role="status">
            <i class="status-dot" id="status-dot"></i>
            <span id="status" class="status-text">正在准备配对信息…</span>
          </div>
        </header>

        <div id="unauthorized" class="notice hidden">
          本机配对链接无效，请使用启动终端中显示的完整地址重新打开。
        </div>

        <div id="content" class="content hidden">
          <div class="qr-column">
            <div class="qr-card">
              <div class="qr-wrap">
                <div id="qr" class="qr"></div>
                <button id="regenerate" class="qr-overlay hidden" type="button" aria-label="重新生成二维码">
                  <strong id="overlay-title">二维码已失效</strong>
                  <span>点击重新生成</span>
                </button>
              </div>
              <p class="qr-tip">打开手机相机或浏览器扫码直接连接</p>
            </div>
          </div>

          <div class="details">
            <div class="form-group">
              <label for="address">局域网访问地址</label>
              <div class="row">
                <select id="address" aria-label="选择局域网访问地址"></select>
                <button id="refresh" class="btn-secondary" type="button" title="重新检测可用局域网地址">刷新网络</button>
              </div>
            </div>

            <div class="form-group">
              <label for="pairing-link">自动配对链接</label>
              <div class="row">
                <input id="pairing-link" readonly spellcheck="false" placeholder="正在生成链接…" aria-label="自动配对链接" />
                <button id="copy" class="btn-secondary" type="button">复制链接</button>
              </div>
            </div>

            <div class="fallback-card">
              <div class="fallback-header">
                <div class="fallback-copy">
                  <span class="fallback-label">备用 6 位访问码</span>
                  <p class="fallback-desc">
                    在手机打开 <a id="fallback-url" href="#" target="_blank" rel="noreferrer">普通访问地址</a> 并输入
                  </p>
                </div>
                <button id="copy-code" class="btn-secondary btn-sm" type="button">复制访问码</button>
              </div>
              <div id="access-code-cells" class="access-code-cells" role="group" aria-label="六位访问码" title="点击复制访问码">
                <span class="digit-cell">-</span>
                <span class="digit-cell">-</span>
                <span class="digit-cell">-</span>
                <span class="digit-cell">-</span>
                <span class="digit-cell">-</span>
                <span class="digit-cell">-</span>
              </div>
              <span id="access-code" class="visually-hidden">------</span>
            </div>

            <p id="message" class="message" role="status" aria-live="polite"></p>
          </div>
        </div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
