appId: io.dsakiko.desktop
productName: 数字小祥
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: python
    to: python
    filter:
      - '**/*'
      - '!tests/**'
      - '!.venv/**'
      - '!**/__pycache__/**'
      - '!**/*.pyc'
  - from: resources
    to: resources
    filter:
      - '**/*'
      - '!*.md'
      - '!builtin-characters/models/**'
asar: true
win:
  icon: build/icon.ico
  executableName: dsakiko
  target:
    - nsis
nsis:
  artifactName: dsakiko-${version}-windows-${arch}-setup.${ext}
  shortcutName: 数字小祥
mac:
  icon: build/macos-icon/Icon.icns
  extendInfo:
    CFBundleIconName: Icon
  extraResources:
    - from: build/macos-icon/Assets.car
      to: Assets.car
  category: public.app-category.entertainment
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip
dmg:
  icon: build/macos-icon/Icon.icns
  artifactName: dsakiko-${version}-macos-${arch}.${ext}
