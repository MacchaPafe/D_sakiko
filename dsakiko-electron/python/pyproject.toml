[project]
name = "dsakiko-prototype-speech"
version = "0.1.0"
description = "独立进程中的 GPT-SoVITS 原型语音服务"
requires-python = ">=3.9,<3.12"
dependencies = [
  "torch==2.7.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "torchaudio==2.7.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "torchaudio==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "transformers==4.57.3",
  "peft==0.18.0; python_version >= '3.10'",
  "peft==0.17.1; python_version < '3.10'",
  "pytorch-lightning==2.6.0",
  "torchmetrics==1.5.0",
  "numpy==1.26.4",
  "scipy==1.16.3; python_version >= '3.11'",
  "scipy==1.13.1; python_version < '3.11'",
  "numba==0.62.1; python_version >= '3.10'",
  "numba==0.60.0; python_version < '3.10'",
  "librosa==0.10.2",
  "soundfile==0.13.1",
  "ffmpeg-python==0.2.0",
  "pyyaml==6.0.3",
  "tqdm==4.67.1",
  "einops==0.8.1",
  "x-transformers==2.11.23",
  "rotary-embedding-torch==0.8.9",
  "fast-langdetect==1.0.0",
  "split-lang==2.1.1",
  "pyopenjtalk==0.4.1",
  "pypinyin==0.55.0",
  "cn2an==0.5.23",
  "jieba==0.42.1",
  "jieba-fast==0.53",
  "g2p-en==2.1.0",
  "g2pk2==0.0.3",
  "ko-pron==1.3",
  "tojyutping==3.2.0",
  "wordsegment==1.3.1",
  "nltk==3.9.2",
  "onnxruntime==1.19.0",
  "opencc==1.1.9",
  "sentencepiece==0.2.1"
]

[tool.uv]
package = false
